[package]
name = "wartlogd"
description = "WartLog daemon: ingests logs and traces, serves the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["otlp", "journald", "kubernetes"]
otlp = ["wartlog-sources/otlp"]
journald = ["wartlog-sources/journald"]
kubernetes = ["wartlog-sources/kubernetes"]

[dependencies]
wartlog-model.workspace = true
wartlog-store.workspace = true
wartlog-query.workspace = true
wartlog-sources = { workspace = true, default-features = false }
wartlog-api.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml = "0.9"
toml_edit = "0.23"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
