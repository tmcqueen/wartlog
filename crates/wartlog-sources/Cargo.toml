[package]
name = "wartlog-sources"
description = "WartLog receivers (OTLP, NDJSON) and collectors (journald, Kubernetes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["otlp", "journald", "kubernetes"]
otlp = ["dep:opentelemetry-proto", "dep:tonic", "dep:prost", "dep:tokio-stream"]
journald = ["dep:libloading"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:futures"]

[dependencies]
wartlog-model.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bytes = "1"
flate2 = "1"
toml = "0.9"
opentelemetry-proto = { version = "0.31", optional = true, default-features = false, features = ["gen-tonic", "logs", "trace", "metrics", "with-serde"] }
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "router", "server", "channel", "codegen", "gzip"] }
prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["net"] }
libloading = { version = "0.8", optional = true }
kube = { version = "2", optional = true, default-features = false, features = ["client", "rustls-tls", "runtime"] }
k8s-openapi = { version = "0.26", optional = true, features = ["latest"] }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
