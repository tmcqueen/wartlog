[package]
name = "wartlog-viewer"
description = "WartLog viewer (Qt 6, QML)"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

# Not a workspace member: it needs Qt 6 development files (qmake6) to build.
[workspace]

[dependencies]
wartlog-model = { path = "../wartlog-model" }
wartlog-store = { path = "../wartlog-store" }
wartlog-query = { path = "../wartlog-query" }
wartlog-api = { path = "../wartlog-api" }
anyhow = "1"
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
tempfile = "3"
