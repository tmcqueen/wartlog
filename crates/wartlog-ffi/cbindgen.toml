# Regenerate the header: cbindgen --config cbindgen.toml --crate wartlog-ffi --output include/wartlog.h
language = "C"
include_guard = "WARTLOG_H"
autogen_warning = "/* Generated by cbindgen from crates/wartlog-ffi/src/lib.rs. Do not edit. */"
header = "/* WartLog C ABI. See crates/wartlog-ffi/README.md. Licensed Apache-2.0. */"
cpp_compat = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[enum]
rename_variants = "None"
prefix_with_name = false

[export]
include = ["wl_writer_mode", "wl_value_type", "wl_source_kind"]
