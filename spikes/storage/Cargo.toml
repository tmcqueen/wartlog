[package]
name = "wl-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "THROWAWAY storage spike for WartLog. Not the real wartlog-store crate."

# Standalone on purpose: not part of any future workspace.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
rayon = "1"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[profile.release]
debug = 1
