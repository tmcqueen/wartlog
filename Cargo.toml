[workspace]
resolver = "2"
members = [
    "crates/wartlog-model",
    "crates/wartlog-store",
    "crates/wartlog-query",
    "crates/wartlog-sources",
    "crates/wartlog-api",
    "crates/wartlogd",
    # "crates/wartlog-cli",
]
# The viewer needs Qt 6 and is built on its own: cargo build -p wartlog-viewer (see crates/wartlog-viewer/README.md)
exclude = ["spikes", "crates/wartlog-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/tmcqueen/wartlog"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
crc32c = "0.6"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
fst = "0.4"
memmap2 = "0.9"
uuid = { version = "1", features = ["v7"] }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
regex = "1"
indexmap = "2"
wartlog-model = { path = "crates/wartlog-model" }
wartlog-store = { path = "crates/wartlog-store" }
wartlog-query = { path = "crates/wartlog-query" }
wartlog-sources = { path = "crates/wartlog-sources" }
wartlog-api = { path = "crates/wartlog-api" }

[profile.release]
debug = 1

[workspace.lints.clippy]
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
